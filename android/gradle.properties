org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# R8 full mode (default in AGP 8.x) strips the generic Signature attribute from
# methods even with -keepattributes Signature. Retrofit needs that attribute to
# extract a suspend function's return type from its Continuation parameter — without
# it, release builds throw "Class cannot be cast to ParameterizedType". Disabling
# full mode makes R8 preserve the Signature attribute.
android.enableR8.fullMode=false
